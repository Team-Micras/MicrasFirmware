name: Build lint and check formatting

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🗃️ Check if already verified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      verified: ${{ steps.cache.outputs.cache-hit }}
      key: ${{ steps.cache.outputs.cache-primary-key }}
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@v7

      # The submodules enter the key through the commits the firmware points at, so they need no
      # checkout here
      - name: 🔗 Read the submodule commits
        id: submodules
        run: echo "hash=$(git ls-tree HEAD external/ | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: 🗃️ Look up verified sources
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .docker/Dockerfile
          key: verified-${{ steps.submodules.outputs.hash }}-${{ hashFiles('.github/workflows/**', '.docker/**', 'cmake/**', 'CMakeLists.txt', 'CMakePresets.json', '.clang-*', 'cube/*.ioc', 'config/**', 'include/**', 'src/**', 'tests/**') }}
          lookup-only: true

  build:
    name: 🔨 Build lint and check formatting
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.verified != 'true'
    timeout-minutes: 30
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: 🗃️ Restore generated cube files
        id: cube
        uses: actions/cache/restore@v6
        with:
          path: cube
          key: cube-${{ hashFiles('cube/*.ioc', '.docker/Dockerfile') }}

      - name: ⚙️ Generate cube files
        if: steps.cube.outputs.cache-hit != 'true'
        run: docker build --file .docker/Dockerfile --target generated --output type=local,dest=cube .

      - name: 🗃️ Save generated cube files
        if: steps.cube.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: cube
          key: ${{ steps.cube.outputs.cache-primary-key }}

      - name: 🐋 Build Docker image
        run: docker build --file .docker/Dockerfile --build-context generated=cube --target build --tag micras:build .

      # A single long lived container is used for every step below, so that the libraries
      # are compiled once instead of once per `docker run`.
      - name: 📦 Start build container
        run: docker run --detach --name micras micras:build sleep infinity

      - name: 🎨 Check code formatting
        run: docker exec micras make -C build --no-print-directory format_check

      - name: 🔨 Build project
        run: docker exec micras make -C build --no-print-directory -j

      - name: 🧪 Build tests
        run: docker exec micras make -C build --no-print-directory -j test_all

      - name: 🚨 Lint project
        run: docker exec micras make -C build --no-print-directory lint

      - name: 📝 Build documentation
        run: docker exec micras make -C build --no-print-directory docs

      - name: 🧹 Stop build container
        if: always()
        run: docker rm --force micras

      - name: 🗃️ Save verified sources
        uses: actions/cache/save@v6
        with:
          path: .docker/Dockerfile
          key: ${{ needs.check.outputs.key }}

  standards:
    name: 📏 Compare the shared standards with micras-lib
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # micras-lib holds the canonical copies, which the firmware carries byte for byte
      - name: 📏 Compare the style and lint files
        run: |
          for file in .clang-format .clang-tidy tests/.clang-tidy cmake/templates/run_clang_tidy.sh.in; do
              cmp "$file" "external/micras-lib/$file"
          done

      - name: 🐋 Compare the host stage of the Dockerfiles
        run: |
          host_stage() {
              sed -n '/^# >>> host stage >>>$/,/^# <<< host stage <<<$/p' "$1"
          }

          test -n "$(host_stage .docker/Dockerfile)"
          diff <(host_stage .docker/Dockerfile) <(host_stage external/micras-lib/.docker/Dockerfile)
