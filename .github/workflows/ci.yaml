name: Build lint and check formatting

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🗃️ Check if already verified
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      verified: ${{ steps.cache.outputs.cache-hit }}
      key: ${{ steps.cache.outputs.cache-primary-key }}
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 🗃️ Look up verified sources
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .docker/Dockerfile
          key: verified-${{ hashFiles('.github/workflows/**', '.docker/**', 'cmake/**', 'CMakeLists.txt', '.clang-*', 'cube/*.ioc', 'config/**', 'include/**', 'src/**', 'tests/**', 'micras_*/**') }}
          lookup-only: true

  build:
    name: 🔨 Build lint and check formatting
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.verified != 'true'
    timeout-minutes: 30
    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐋 Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          target: build
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: build
          tags: micras:build

      - name: 🎨 Check code formatting
        run: docker run --rm micras:build make -C build --no-print-directory format_check

      - name: 🔨 Build project
        run: docker run --rm micras:build make -C build --no-print-directory -j

      - name: 🧪 Build tests
        run: docker run --rm micras:build make -C build --no-print-directory -j test_all

      - name: 🚨 Lint project
        run: docker run --rm micras:build make -C build --no-print-directory -j lint

      - name: 🗃️ Save verified sources
        uses: actions/cache/save@v6
        with:
          path: .docker/Dockerfile
          key: ${{ needs.check.outputs.key }}
