services:
  build:
    command: make -C build --no-print-directory -j
    build:
      dockerfile: .docker/Dockerfile
      target: build

  lint:
    command: make -C build --no-print-directory lint
    build:
      dockerfile: .docker/Dockerfile
      target: build

  check-format:
    command: make -C build --no-print-directory format_check
    build:
      dockerfile: .docker/Dockerfile
      target: build

  dev:
    command: bash
    build:
      dockerfile: .docker/Dockerfile
      target: dev
    privileged: True
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - .:/project:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority
