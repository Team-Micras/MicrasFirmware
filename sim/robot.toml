width = { value = 0.003465, source = "CAD v2: params.tire_w, the tire cut to the hub's channel" }
track = { value = 0.045535, source = "CAD v2: params.track, tire center to tire center (tires 0.5 mm inside the board's sides)" }
mass = { value = 0.0064, source = "CAD v2 and estimate: brass 36T wheel gear 4.3 g (estimated from its volume: weigh it), hub 0.65 g, tire 0.5 g, magnet 0.42 g, axle 0.32 g, magnet cup, race spacer and the bearings' inner rings; 2.7 g with the printed stand-in gear" }
spin_inertia = { value = 2.89e-7, source = "CAD v2: about the axle, the brass gear 61 % of it; 1.23e-7 with the printed stand-in gear" }
friction = { value = 1.0, source = "estimate: 2 mm tire band on a maze floor; measure by tilting" }
torsional_friction = { value = 0.0005, source = "estimate: half the contact patch width (v1)" }
contact_time_constant = { value = 0.011, source = "estimate: the Kyosho MZW40-20 compound, Shore 20 (about 0.7 MPa, 1.4 times stiffer for the confined 1.89 mm layer), sinks 75 to 105 um under the 0.43 N a tire carries without the fan, 4000 to 6000 N/m; 11 ms sinks it 64 um (6600 N/m) and rolls it 29 um short of its radius, 58 um with the fan; measure the rolling radius by driving a known distance with the fan on and off" }
contact_damping_ratio = { value = 1.0, source = "estimate" }

[drive]
# 1020 coreless motors (10 x 20 mm class, measured 9.61 x 20.30, 1 mm shaft),
# the same for both wheels and the fan. The only figure known of them is 18k rpm
# without load at 12 V; the rest is scaled from RIC Motor's 1020DT 12 V
# windings (120160: 16000 rpm, 9 mA, stall 0.65 A and 47 g cm; 120190: 19200
# rpm, 15 mA, stall 0.83 A and 50 g cm), interpolated to 18000 rpm.
winding_resistance = { value = 15.4, source = "estimate: RIC 1020DT 12 V windings interpolated to 18k rpm (12 V over the stall current: 18.5 ohm at 16000 rpm, 14.5 at 19200); measure with an ohmmeter across a locked motor, or 12 V over the stall current" }
bridge_resistance = { value = 0.66, source = "datasheet: L6205D, one conducting path at 25 C, 0.62 ohm, and the 40 mOhm shunt in series (R32/R33)" }
torque_constant = { value = 0.00627, source = "estimate: (12 V - no-load current x resistance) / 18000 rpm, the owner's no-load figure; measure the no-load speed at a known voltage with a tachometer or the encoder" }
speed_constant = { value = 0.00627, source = "estimate: the torque constant, 1523 rpm/V" }
no_load_current = { value = 0.05, source = "estimate from a measurement: a free motor on the v1 gears (5.25) and wheels drew 290 mA at 20 V (owner), with 16.06 ohm about 15.3 V of back EMF: 4.5 W of friction, 1.8 mN m at some 2450 rad/s; the wheels' air drag is negligible (1e-6 N m) and their inertia takes no torque at a steady speed. A constant 1.8 mN m would brake the robot at 20 m/s2, so most of it grows with speed: taken as the bare motor's 13 mA (RIC 1020 estimate) plus a drag proportional to speed, the constant this model needs is the friction near 1 m/s (466 rad/s at the motor), about 50 mA. A coast-down test settles it: spin a wheel up, cut the drive, log the encoder; the deceleration times the 2.1e-8 kg m2 at the motor (rotor 1.4e-8 plus the wheel's spin inertia over the gear ratio squared) is the friction torque at each speed" }
rotor_inertia = { value = 1.4e-8, source = "estimate: a 10 mm coreless rotor (about 1 g of winding at 4 mm radius), 0.13 g cm^2, and the brass 7T pinion, 0.01 g cm^2" }
gear_ratio = { value = 5.142857, source = "CAD v2: 0.5M spur pair, 7T pinion and 36T wheel gear (params.Gears), 36/7" }
gear_efficiency = { value = 0.9, source = "estimate: one brass spur stage of 0.5 module; about 0.85 with the printed stand-in pair" }
supply_voltage = { value = 19.63, source = "CAD and datasheet: TPS611781 feedback divider 2 MOhm / 130 kOhm (measured 19.66 V, hw_debug G16)" }

[encoders]
