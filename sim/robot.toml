# Micras with the v2 chassis, as designed.
#
# The physical truth the simulator builds its model and devices from; the
# firmware's config/targets/v1/robot.hpp is the robot's belief about itself, and
# the `sim_robot_report` target shows where the two differ.
#
# Frames follow robot.hpp: x forward, y left, z up, origin on the floor under the
# midpoint of the wheel axle. Lengths in meters, masses in kilograms, angles in
# degrees where the key ends in _deg.
#
# The board is the same as v1's (hw_debug: L6205D, TPS611781, LSM6DSV, the four
# W1..W4 footprints). Everything mounted on it is the v2 chassis, the parametric
# build123d CAD of MicrasHardware (branch chassis-v2, commit 96a12ad), which uses
# this same frame in millimeters: micras/params.py (board, motor, gears, wheel,
# battery), drive.py, fan.py, front.py (sensor caps, bumper), leds.py (SFH 4550
# and TPS601A from their datasheets), frame.py (battery basket). Masses and
# inertias: each printed part's CAD volume times its density (mass.py: resin
# 1.15, PLA 1.24, TPU 1.21 g/cm^3), each bought part's mass from mass.py placed
# and shaped by its CAD model, the bare board from its real outline (1.04 mm
# FR-4 at 1.85 g/cm^3), and the populated board's 15 g estimate spread over the
# component boxes of ref/board_boxes.json. Bounding boxes are the CAD's.
#
# Sources: "CAD v2" (the build123d chassis), "CAD" (the KiCad board),
# "datasheet" (named), "measured", "firmware" (target.hpp, the CubeMX project),
# "owner", "estimate" (with what to measure).

schema = 1
name = "micras"

[integration]
# One firmware loop; halving it changed neither the contacts nor the trace.
timestep = { value = 0.000125, source = "measured: tire contact, penetration and the explore trace unchanged at 62.5 and 31.25 us (v1)" }

[chassis]
mass = { value = 0.0743, source = "CAD v2 and estimate: 87.1 g for the whole robot less the two 6.4 g wheel assemblies; includes the 15 g populated board (estimate: weigh it), three 6 g cells (estimate), three 7 g motors (measured), 2 g of wires and 2.8 g of screws, inserts and nuts (estimates); weigh the robot" }
center_of_mass = { value = [0.00005, 0.0, 0.0181], source = "CAD v2: Battery.x = -9.52 puts the whole robot's center of mass 0.05 mm ahead of the axle, within what the estimated masses can tell; balance the robot on its wheels to find which way it rests" }
inertia = { value = [2.05e-5, 3.81e-5, 3.53e-5], source = "CAD v2: about the center of mass, from the part volumes; Ixz = 5.2e-6 left out (principal axes 17 deg off in pitch); Ixx and Izz less 2.09e-6, since the simulation puts each wheel's 6.4 g at the tire center (y 22.8 mm) and its real center of mass is at y 18.8 mm (magnet, axle and gear inboard); measure yaw with a torsion pendulum" }
outline = { value = [[0.0535, 0.0150], [0.03456, 0.02447], [0.0323, 0.0250], [-0.0365, 0.0250], [-0.0365, -0.0250], [0.0323, -0.0250], [0.03456, -0.02447], [0.0535, -0.0150]], source = "CAD: KiCad board edge, nose chamfers at 26.6 deg, fillets as corners (unchanged board)" }
board_bottom = { value = 0.001, source = "CAD v2: Board.bottom_z" }
board_top = { value = 0.0020412, source = "CAD v2: 1.0412 mm FR-4" }
friction = { value = 0.3, source = "estimate: FR-4 on a painted floor" }

