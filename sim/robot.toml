# The robot has no third wheel: it rests on a rear contact when it accelerates,
# and on its bumper with the fan on or when it brakes. Both are 0.1 mm above
# the floor, so the body only tips about 0.3 deg between them: with the
# center of mass over the axle it rocks from one to the other at every change
# of acceleration, and a wider swing slams the rear contact down hard enough to
# unload the tires. Both are PTFE glides. Two skids stand in for them. Their
# contacts are frictionless, since a sliding frictional contact would lift the
# robot off the floor in MuJoCo, and the simulator applies their friction as a
# force instead; each touches the floor before any frictional geom near it does.
[[chassis.skids]]
name = "rear_skid"
center = { value = [-0.0355, 0.0, 0.0011], source = "owner: a PTFE glide under the rear edge of the board, its bottom 0.1 mm above the floor (the bare board edge is 1 mm above it)" }
radius = { value = 0.001, source = "simulation" }
friction = { value = 0.15, source = "estimate: a PTFE glide on a painted floor, 0.05 to 0.2 in tables; measure by tilting the robot on its glides" }

[[chassis.skids]]
name = "front_skid"
center = { value = [0.0552, 0.0, 0.0016], source = "owner: a PTFE glide on the bumper's rounded lower edge (BumperParams.nose_r 1.5 mm), its bottom 0.1 mm above the floor and 55.2 mm ahead of the axle" }
radius = { value = 0.0015, source = "CAD v2: BumperParams.nose_r" }
friction = { value = 0.15, source = "estimate: a PTFE glide on a painted floor, 0.05 to 0.2 in tables; measure by tilting the robot on its glides" }

